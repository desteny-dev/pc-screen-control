name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check src/ tests/

      - name: Compile
        run: python -m py_compile src/server.py

      - name: Manifest is valid and matches the server version
        shell: python
        run: |
          import json, re, sys
          m = json.load(open("src/manifest.json", encoding="utf-8"))
          src = open("src/server.py", encoding="utf-8").read()
          v = re.search(r'SERVER_VERSION\s*=\s*"([^"]+)"', src).group(1)
          print("manifest", m["version"], "| server", v)
          sys.exit(0 if m["version"] == v else 1)

      - name: Setup logic
        run: python tests/test_installer.py

      - name: Update download is verified against its hash
        run: python tests/test_update_verify.py

      - name: The core is offline - no network, no runtime install, zero sockets
        run: python tests/test_offline.py

      - name: One takeover per burst, warned on screen, restored once
        run: python tests/test_session.py

      - name: Serves any MCP client over stdio, and fails politely
        run: python tests/test_any_client.py

      - name: Registering with GPT does not damage an existing config
        run: python tests/test_gpt_install.py

      - name: Keystrokes never land in the wrong window
        run: python tests/test_wrong_window.py

      - name: The window the user was in cannot be made to disappear
        run: python tests/test_user_window.py

      # Somebody's first instinct is `pytest`, and that path used to end in
      # INTERNALERROR with exit code 0 - it looked like "there are no tests"
      # rather than "the runner broke". Now it is a step of its own, so it
      # cannot quietly stop working again.
      - name: pytest collects and runs the suite
        run: |
          pip install pytest
          python -m pytest -q

      - name: Every tool that can change the screen is guarded
        run: python tests/test_guard_coverage.py

      - name: A ref survives the page moving underneath it
        run: python tests/test_refs_stale.py

      - name: Non-ASCII survives the protocol
        run: python tests/test_encoding.py

      - name: Refs resolve, and cheap tools refuse the mouse
        run: python tests/test_refs.py

      - name: Blind input is refused after a takeover
        run: python tests/test_takeover.py

      - name: Focus is really handed back
        run: python tests/test_restore.py

      - name: The handover happens in the right order
        run: python tests/test_handover.py

      - name: Claimed windows are parked safely and rescued
        run: python tests/test_claim.py

      - name: Protocol handshake and tool list
        shell: python
        run: |
          import json, subprocess, sys
          req = "\n".join([
              json.dumps({"jsonrpc": "2.0", "id": 1,
                          "method": "initialize", "params": {}}),
              json.dumps({"jsonrpc": "2.0", "id": 2,
                          "method": "tools/list", "params": {}}),
          ])
          p = subprocess.run([sys.executable, "src/server.py"],
                             input=req, capture_output=True, text=True,
                             timeout=120)
          lines = [json.loads(l) for l in p.stdout.splitlines() if l.strip()]
          assert len(lines) == 2, p.stderr
          assert lines[0]["result"]["serverInfo"]["name"] == "pc-screen-control"
          tools = lines[1]["result"]["tools"]
          print("tools:", len(tools))
          assert len(tools) >= 25
          for t in tools:
              assert t["name"] and t["description"] and t["inputSchema"]

      - name: Reads a real desktop
        run: python tests/measure_desktop.py

      - name: Stress - cost, nonsense, broken protocol, repetition
        run: python tests/stress.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-py${{ matrix.python }}
          path: tests/measurement_report.md
          if-no-files-found: ignore
